name: Build CryptDroid APK

# 触发方式：
#  1) 推送 main 分支 → 自动构建 debug APK（无签名，可安装验证）
#  2) 手动运行 → 可选 debug / release（release 需配置签名 Secret）
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型：debug=调试（无签名）/ release=正式自签名'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK (runner 自带；接受 licenses + 显式安装 NDK)
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          # 接受全部 licenses（含 NDK/CMake/build-tools）
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          # 显式安装 NDK（编译 native 层 .so 需要）
          $SDKMANAGER --install "ndk;27.2.12479018" > /dev/null 2>&1 || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine build type (push 默认 debug)
        id: bt
        run: |
          BT="${{ github.event.inputs.build_type }}"
          if [ -z "$BT" ]; then BT="debug"; fi
          echo "BT=$BT" >> "$GITHUB_OUTPUT"
          echo "构建类型: $BT"

      - name: Restore signing keystore (仅 release 需要)
        if: steps.bt.outputs.BT == 'release'
        env:
          P12_B64: ${{ secrets.CRYPTPWA_NATIVE_P12 }}
        run: |
          if [ -n "$P12_B64" ]; then
            echo "$P12_B64" | base64 -d > app/cryptpwa-release.p12
            echo "keystore restored from secret"
          else
            echo "::error::release 构建需要 Secret: CRYPTPWA_NATIVE_P12"
            exit 1
          fi

      - name: Build APK
        run: |
          BT="${{ steps.bt.outputs.BT }}"
          if [ "$BT" = "release" ]; then
            ./gradlew :app:assembleRelease
          else
            ./gradlew :app:assembleDebug
          fi

      - name: Tag & Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BT="${{ steps.bt.outputs.BT }}"
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          APK_SRC="app/build/outputs/apk/$BT/app-$BT.apk"
          APK_NAME="CryptDroid_${TAG}_${BT}.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::APK not found: $APK_SRC"
            find app/build/outputs -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          cp "$APK_SRC" "$APK_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" "$APK_NAME" \
            --title "CryptDroid $TAG" \
            --notes "Kotlin + Jetpack Compose 原生版 $BT 构建。签名：$([ "$BT" = "release" ] && echo '正式自签名' || echo '未签名(debug)')。由 GitHub Actions 自动生成。"
